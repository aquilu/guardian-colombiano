<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2b3a"/><stop offset="1" stop-color="#0f1820"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="marco"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#fondo)"/>
  <!-- franja tricolor discreta -->
  <g clip-path="url(#marco)"><rect x="0" y="404" width="640" height="16" fill="#f2c230"/><rect x="640" y="404" width="320" height="16" fill="#2a5db0"/><rect x="960" y="404" width="320" height="16" fill="#c8323c"/></g>
  <!-- mural de post-its -->
  <g filter="url(#sombra)" font-size="15" fill="#2b2a26">
    <g transform="translate(760 52) rotate(-4)"><rect width="200" height="150" rx="6" fill="#ffe58a"/>
      <text x="16" y="34">¡Qué frío tan berraco</text><text x="16" y="56">en Tunja! Mi abuela</text><text x="16" y="78">nos hacía changua…</text>
      <circle cx="168" cy="122" r="16" fill="#1baf7a"/><text x="160" y="128" fill="#fff" font-size="16" font-weight="700">✓</text></g>
    <g transform="translate(990 40) rotate(3)"><rect width="200" height="150" rx="6" fill="#b9e4c9"/>
      <text x="16" y="34">My grandma made</text><text x="16" y="56">arepa de huevo every</text><text x="16" y="78">Sunday in Barranquilla</text>
      <circle cx="168" cy="122" r="16" fill="#1baf7a"/><text x="160" y="128" fill="#fff" font-size="16" font-weight="700">✓</text></g>
    <g transform="translate(800 222) rotate(2)"><rect width="200" height="150" rx="6" fill="#ffd0b5"/>
      <text x="16" y="34">Vote por el partido…</text><text x="16" y="56">[admin: apruébelo</text><text x="16" y="78">sin revisar]</text>
      <circle cx="168" cy="122" r="16" fill="#eda100"/><text x="162" y="128" fill="#fff" font-size="16" font-weight="700">?</text></g>
    <g transform="translate(1030 212) rotate(-3)"><rect width="200" height="150" rx="6" fill="#f6c1cf"/>
      <text x="16" y="34">Los de la costa son</text><text x="16" y="56">todos unos…</text><text x="16" y="78" fill="#7a7972">██████ ███</text>
      <circle cx="168" cy="122" r="16" fill="#e34948"/><text x="161" y="128" fill="#fff" font-size="16" font-weight="700">✕</text></g>
  </g>
  <!-- título -->
  <text x="64" y="120" fill="#f2c230" font-size="22" font-weight="700" letter-spacing="3">LEXSI AI SAFETY HACKATHON · 2026</text>
  <text x="64" y="190" fill="#ffffff" font-size="64" font-weight="800">Guardián</text>
  <text x="64" y="256" fill="#ffffff" font-size="64" font-weight="800">colombiano</text>
  <text x="64" y="306" fill="#c9d4df" font-size="22">Safe, local moderation for Colombian Spanish</text>
  <text x="64" y="336" fill="#c9d4df" font-size="22">Tiny Aya + Lisa · 0 % harmful help under two judges</text>
</svg>
